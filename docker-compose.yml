# YMIR — Master Container Manifest
# Service skeleton. Populate image/build configs when services are implemented.

services:
  # Primary Agent Engine (commando-hq equivalent)
  ymir-core:
    build:
      context: .
    container_name: ymir_core
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis-bus:6379
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
    volumes:
      - ./svartalfaheim:/app/svartalfaheim
      - ./midgard:/app/midgard
      - ./workspace:/app/workspace
      - ./.agents:/app/.agents
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis-bus

  # SKRYMIR — Web File Explorer
  file-service:
    image: filebrowser/filebrowser:v2.30.0
    container_name: ymir_file_explorer
    restart: unless-stopped
    volumes:
      - ./svartalfaheim:/srv/realms
      - ./midgard:/srv/shared
      - ./.agents/filebrowser/filebrowser.db:/database/filebrowser.db
      - ./.agents/filebrowser/.filebrowser.json:/.filebrowser.json
    environment:
      - FB_BASEURL=/files

  # RATATOSKR — Inter-Agent Event Bus
  redis-bus:
    image: redis:7-alpine
    container_name: ymir_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # BIFROST — Reverse Proxy Gateway
  gateway-proxy:
    image: nginx:alpine
    container_name: ymir_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.agents/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
    depends_on:
      - ymir-core
      - file-service

  # GJALLARHORN — Cloudflare Tunnel (outbound)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ymir_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - gateway-proxy

volumes:
  redis_data: