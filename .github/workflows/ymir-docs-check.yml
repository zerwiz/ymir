name: docs-check

on:
  push:
    branches: [main]
    paths:
      - catalog.yaml
      - principles.yaml
      - AGENTS.md
      - README.md
      - docs/**
      - docs.html
      - .agents/skills/**/SKILL.md
      - scripts/**
      - .prettierrc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/docs-check.yml
  pull_request:
    branches: [main]
    paths:
      - catalog.yaml
      - principles.yaml
      - AGENTS.md
      - README.md
      - docs/**
      - docs.html
      - .agents/skills/**/SKILL.md
      - scripts/**
      - .prettierrc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/docs-check.yml

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:test
      - run: pnpm run docs:check
      - name: Verify generated docs match source
        run: |
          set -eu
          if [ -z "$(cd docs && git status --porcelain)" ]; then
            echo "Docs are in sync. OK."
          else
            echo "::error::docs/ drifts from AGENTS.md and Architecture.md. Run the docs generator and commit the result."
            echo "Stale files:"
            git -C docs status --porcelain
            exit 1
          fi