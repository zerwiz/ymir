name: ymir-sdk-ci

on:
  push:
    branches: [main]
    paths:
      - package.json
      - packages/**/*
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ymir-sdk-ci.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - packages/**/*
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/ymir-sdk-ci.yml
      # release-please opens its release PR with GITHUB_TOKEN, which creates a
      # pull_request run in action_required. Excluding its output set means no
      # run is ever created.
      - "!packages/**/CHANGELOG.md"
      - "!packages/**/package.json"
      - "!packages/**/package-lock.json"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm --recursive --if-present run build
      - run: pnpm --recursive --if-present test