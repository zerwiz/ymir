name: Ymir changelog fragments

# The changelog is told through FRAGMENTS (CHANGELOG.d/<date>-<slug>.md), not by
# editing CHANGELOG.md — so two branches never touch the same file and can never
# conflict on it. This workflow is the layer that makes the convention hold:
#
#   * on a PR  — a change that touches code must add a fragment (or carry the
#                `no-changelog` label, which records the deliberate decision that
#                no entry belongs).
#   * on main  — every fragment must be FOLDED into CHANGELOG.md. A GitHub merge
#                bypasses the local pre-push hook, so a merged fragment would
#                otherwise sit unfolded and the ledger would fall silently behind.
#
# The local pre-push hook (bin/changelog-guard.sh --install) does the same on a
# local push; this is the same duty enforced at the layer GitHub actually runs.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  # On main: the ledger must not be behind the fragments.
  folded:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every fragment is folded into CHANGELOG.md
        run: bash bin/changelog-assemble.sh --check

  # On a PR: a code change must tell its story — a fragment, or the label.
  fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A code change carries a fragment (or no-changelog)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"

          # The deliberate opt-out, recorded rather than forgotten.
          case ",$LABELS," in
            *,no-changelog,*) echo "changelog-fragment: no-changelog label — ok"; exit 0 ;;
          esac

          # A fragment ADDED in this PR satisfies the duty.
          if printf '%s\n' "$changed" | grep -E '^CHANGELOG\.d/.+\.md$' | grep -qv 'README\.md$'; then
            echo "changelog-fragment: fragment added — ok"; exit 0
          fi

          # An edit to the ledger itself also satisfies it (the older form).
          if printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "changelog-fragment: CHANGELOG.md edited — ok"; exit 0
          fi

          # A change that touches no code and no docs needs no entry.
          if ! printf '%s\n' "$changed" | grep -qE '^(bin/|apps/|\.agents/|\.pi/|\.opencode/|RULES/|docs/|scripts/|config/)'; then
            echo "changelog-fragment: no code or docs changed — ok"; exit 0
          fi

          echo "::error::This change tells no story. Add a fragment:"
          echo "  CHANGELOG.d/$(date +%F)-<slug>.md   starting with '## $(date +%F) — title'"
          echo "  (or add the 'no-changelog' label when an entry truly does not belong)"
          exit 1
