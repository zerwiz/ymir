name: deploy-production

# Production deploy — manual dispatch only, gated by the `production` GitHub
# Environment (required reviewer = the Allfather). Secrets are environment-scoped.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hlidskjalf/package-lock.json

      - name: Build Hlidskjalf
        working-directory: apps/hlidskjalf
        run: |
          npm ci
          npm run build

      - name: Deploy to production (Netlify)
        working-directory: apps/hlidskjalf
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify deploy \
            --dir=dist \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --prod \
            --message "production ${{ github.sha }}"
