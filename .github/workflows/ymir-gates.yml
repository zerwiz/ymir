name: The gates

# One room, two doors. GitHub Actions and Forgejo Actions are two hosts for the SAME
# command, bin/gates/ci-verify.sh, so the checks have exactly one home and cannot drift between
# hosts. If a host needs a different runner label, that is one line in one file and no
# change to what is proved.
on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The node version is PINNED, not inherited. The runner's preinstalled Node
      # was a version that cannot run the contract tests at all: those tests are
      # TypeScript (`node --test packages/contracts/test/`), and type stripping
      # is only on by default from Node 22.18 / 23.6. The gate therefore failed
      # on correct code with a test error no seat could reproduce. A gate whose
      # result depends on whatever the runner shipped is not a gate.
      - name: Seat the node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Rule 11 is judged against the range a PR adds. actions/checkout fetches the merge
      # commit only, so the base branch is fetched here — without it the no-delete gate could
      # only skip, and RULES/11 names CI as one of the three places it runs.
      - name: The base, for the Rule 11 range
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: The gates
        run: bash bin/gates/ci-verify.sh
