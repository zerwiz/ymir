name: OpenSSF Scorecard

# Scorecard reads the repository from the outside and scores it against the published
# supply-chain practice: is `main` protected, is a security policy present, does the
# project update its dependencies, do the workflows pin their actions, does it publish
# its results. Its checks and what each one asks: https://github.com/ossf/scorecard
#
# Three runs, and none of them is a PR gate:
#   * weekly, on Saturday — the score moves when the repository's SETTINGS move, not only
#     when its files do, so it needs its own clock;
#   * on a push to main — so a change that lowers the score is noticed the same day;
#   * on a change to branch protection — the setting that moves the score most.
#
# It never blocks a merge. Its result is recorded in the plan that owns the public
# repository's practice, and the score is read there, not here.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 6"    # Saturday 07:23 UTC — a quiet hour, off the other jobs' marks
  push:
    branches: ["main"]
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Read the workflow results API (the Token-Permissions and Dangerous-Workflow checks).
      actions: read
      contents: read
      # Publish the result to the public OpenSSF database, so the badge and the score
      # do not live only in this repository's own actions log.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to a major tag so a patch fix arrives without an edit here; pin to a full
      # commit sha if your policy requires it (Dependabot will then keep it current).
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publish to the OpenSSF database. Only works for a public repository, and only
          # from the default branch or a schedule — a fork's run stays local.
          publish_results: true

      # Keep the raw result 30 days: the plan quotes the score, the artifact proves it.
      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 30
          if-no-files-found: error

      # And put it where the Security tab reads it.
      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
