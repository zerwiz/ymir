name: deploy-staging

# Zero-trust deploy: secrets live in GitHub Environment secrets, never in commits.
# Staging auto-deploys on main; production is a separate, approval-gated workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/hlidskjalf/package-lock.json

      - name: Build Hlidskjalf
        working-directory: apps/hlidskjalf
        run: |
          npm ci
          npm run build

      - name: Deploy to staging (Netlify)
        working-directory: apps/hlidskjalf
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify deploy \
            --dir=dist \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "staging ${{ github.sha }}"
