name: Ymir secret scan

# Runs bin/secret-guard.sh over every tracked file on PRs and main, so a
# contributor's accidental key or private env file is caught before merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets
        run: bash bin/secret-guard.sh --all
