name: Ymir secret scan

# Two halves of one question — "does a secret ship?" — on every PR and on main:
#
#   secret-guard  the house's own ward (bin/gates/guards/secret-guard.sh) over every
#                 tracked file: private env files and the obvious key shapes.
#   gitleaks      gitleaks over the tree AND THE WHOLE HISTORY, through the house's own
#                 door (bin/gates/secret-scan.sh), so a credential that was committed and
#                 then deleted in a later commit is still found. `fetch-depth: 0` is what
#                 makes the history readable — with the default depth of 1, gitleaks can
#                 only see the last commit and the scan proves nothing about yesterday.
#
# The rules are the repository's `.gitleaks.toml`: gitleaks' own shapes plus an allowlist
# of files that carry a secret shape on purpose. The operator's own words (people, clients,
# domains, hosts) are NOT in this repository and are not scanned here — they live in the
# private home and are scanned on the operator's machine by the same door. A CI runner has
# no home, so this job is the shared half, and it is the half that must pass for everyone.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets
        run: bash bin/gates/guards/secret-guard.sh --all

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the whole history — without it, gitleaks judges one commit

      # The pinned release, verified against the checksum published beside it, so the
      # scanner that judges a PR is the same binary on every run and cannot be swapped
      # by a mirror.
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -sSL -o "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          install -m 0755 "$tmp/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # The house's door, so CI runs exactly what a maintainer runs: the tree, and every
      # commit on every branch. A finding fails the job; the match is redacted in the log.
      - name: Scan the tree and the whole history
        run: bin/gates/secret-scan.sh tree
