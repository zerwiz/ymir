# Gjallarhorn — the `ymir` tunnel. Hosts the Hlidskjalf control plane and the
# Smíðja trace UI behind the same gate.
#
#   ymir.example.org        ->  http://127.0.0.1:3889  (Hlidskjalf; gate + API)
#   smidja.example.org  ->  http://127.0.0.1:3889  (Smíðja; gate then proxy :8437)
#
# Created with:  cloudflared tunnel create ymir
#                cloudflared tunnel route dns --overwrite-dns <id> ymir.example.org
#                cloudflared tunnel route dns --overwrite-dns <id> smidja.example.org
#
# SECURITY: Hlidskjalf's auth is a mock until Heimdall (oauth2-proxy) lands.
# Put an authenticating origin (Bifrost → Heimdall) in front before broad
# public exposure; until then this hostname is open.
tunnel: ymir
credentials-file: /home/<user>/.cloudflared/<tunnel-id>.json   # rendered per machine

ingress:
  - hostname: ymir.example.org
    service: http://127.0.0.1:3889
    originRequest:
      noTLSVerify: true
  - hostname: smidja.example.org
    service: http://127.0.0.1:3889
    originRequest:
      noTLSVerify: true
  - service: http_status:404
