# Heimdall — the watchman (OAuth2-proxy / Authentik)
# Nothing crosses Bifrost unvouched. GitHub OAuth → session cookie → upstream.
# Secrets come from the environment (`.env.local`); never inline them here.
#
#   HEIMDALL_OAUTH_CLIENT_ID / HEIMDALL_OAUTH_CLIENT_SECRET / HEIMDALL_COOKIE_SECRET

provider = "github"
email_domains = [ "*" ]

# GitHub org/team gate (optional): restrict to your org.
# github_org = "${GITHUB_ORG}"
# github_team = "ymir"

http_address = "0.0.0.0:4180"
upstreams = [ "http://127.0.0.1:3888" ]

client_id = "${HEIMDALL_OAUTH_CLIENT_ID}"
client_secret = "${HEIMDALL_OAUTH_CLIENT_SECRET}"
cookie_secret = "${HEIMDALL_COOKIE_SECRET}"

cookie_name = "_ymir_heimdall"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Realm scoping is enforced upstream (Svartalfaheim); the proxy only vouches.
set_xauthrequest = true
pass_access_token = false
skip_provider_button = true

redirect_url = "https://${HLIDSKJALF_DOMAIN}/oauth2/callback"
