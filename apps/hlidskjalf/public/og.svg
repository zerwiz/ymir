<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b101c" />
      <stop offset="0.55" stop-color="#0a0f1a" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="og-glow" cx="0.28" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="0.5" stop-color="#0ea5e9" stop-opacity="0.08" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="og-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="0.5" stop-color="#475569" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="og-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />

  <rect x="0" y="0" width="1200" height="6" fill="url(#og-metal)" />
  <rect x="0" y="624" width="1200" height="6" fill="#1e293b" />

  <!-- Ymir mark -->
  <g transform="translate(96 150) scale(0.62)">
    <g fill="url(#og-metal)" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.5">
      <polygon points="120,100 168,100 256,188 344,100 392,100 276,216 276,340 236,340 236,216" />
      <polygon points="100,340 412,340 400,388 112,388" />
      <polygon points="132,408 380,408 368,440 144,440" />
    </g>
  </g>

  <!-- Wordmark block -->
  <g font-family="'Cinzel', Georgia, 'Times New Roman', serif">
    <text x="612" y="208" fill="#e8edf6" font-size="104" font-weight="700" letter-spacing="14">YMIR</text>
    <text x="616" y="258" fill="#38bdf8" font-size="30" font-weight="500" letter-spacing="16">HLIDSKJALF</text>
  </g>

  <text x="616" y="330" fill="#b3c0d4" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22">
    One operator. Every realm.
  </text>

  <text x="616" y="392" fill="#7b8aa3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17">
    The sovereign's seat — the fleet, the A2A task stream,
  </text>
  <text x="616" y="420" fill="#7b8aa3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17">
    the well, the runes, the reviews.
  </text>

  <rect x="616" y="470" width="72" height="3" fill="#38bdf8" />

  <text x="616" y="530" fill="#4b5a73" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" letter-spacing="2">
    AGENTIC OPERATING SYSTEM · LOCAL-FIRST · OSS-FIRST
  </text>

  <!-- rune ticks bottom-right -->
  <text x="1036" y="566" fill="#334155" font-family="'Cinzel', Georgia, serif" font-size="34">ᛉ ᛗ ᛒ</text>
</svg>
