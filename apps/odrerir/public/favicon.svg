<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Ymir — the Algiz mark over the anvil, cut in stone and bronze">
  <defs>
    <!-- Stone: the surface everything is cut into -->
    <linearGradient id="stone" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#151209" />
      <stop offset="100%" stop-color="#0e0c09" />
    </linearGradient>

    <!-- The iron mass: bronze-deep, the metal the mark is forged from.
         userSpaceOnUse, not objectBoundingBox: a horizontal anvil bar has a
         zero-height bbox, and an object-bounding-box gradient on it is not
         painted at all — which is why the bars were missing from every icon. -->
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="448">
      <stop offset="0%" stop-color="#7d5f2a" />
      <stop offset="100%" stop-color="#4a3d2a" />
    </linearGradient>

    <!-- The chiselled edge: bronze -->
    <linearGradient id="chisel" gradientUnits="userSpaceOnUse" x1="128" y1="128" x2="384" y2="432">
      <stop offset="0%" stop-color="#c9973f" />
      <stop offset="100%" stop-color="#7d5f2a" />
    </linearGradient>

    <!-- Carved depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- The slate -->
  <rect width="512" height="512" rx="48" fill="url(#stone)" stroke="#2b241a" stroke-width="4"/>

  <g filter="url(#shadow)">

    <!-- 1. THICK OUTER BASE (the iron mass) -->
    <g fill="none" stroke="url(#metal)" stroke-width="48" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Algiz Y-stem & branches -->
      <path d="M 144 144 L 256 256 L 368 144 M 256 256 V 352" />
      <!-- Top anvil bar -->
      <path d="M 128 352 H 384" />
      <!-- Bottom anvil bar (slightly narrower) -->
      <path d="M 160 432 H 352" />
    </g>

    <!-- 2. THIN INNER HIGHLIGHT (the bronze chiselled edge) -->
    <g fill="none" stroke="url(#chisel)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M 144 144 L 256 256 L 368 144 M 256 256 V 352" />
      <path d="M 128 352 H 384" />
      <path d="M 160 432 H 352" />
    </g>

  </g>
</svg>
