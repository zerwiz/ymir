# app.yaml — the app contract (Ymir's split, plan 01 §3; the smithy's plan 08).
name: smidja
title: Smíðja — the smithy, the agent factory
kind: electron                 # its window is the viewer (:8437), opened by Ymir's desktop shell or apps/visualizer/desktop
window_class: ymir-smidja
ports: [8437]                  # the viewer API + UI, loopback only
units: [smidja.service]        # rendered by Ymir's units step from tools/web/systemd/smidja.service, through the resolver
launchers: []
icons: []
state_dir: ${XDG_STATE_HOME:-~/.local/state}/smidja        # the trace lives where the runner resolves it (SMIDJA_DB)
config_dir: ${XDG_CONFIG_HOME:-~/.config}/smidja
ymir:
  min_version: ""
  doors:
    - { name: well, need: optional }            # Völundr's memory: "always a boost, never a blocker"
    - { name: model-catalog, need: optional }   # bin/model/catalog.sh, when Ymir is present
    - { name: mcp-seating, need: optional }     # bin/bridge/mcp-config.sh seat carries the Smíðja MCP to every harness
  packages: []
worker: pi                     # only pi works inside a run (the Allfather, 2026-11-19); every harness may drive one
history: "cut from zerwiz/ymir apps/smidja-factory (root) and apps/smidja (engine/) with git filter-repo, 2026-11-19"
