# Dex — the issuer Gimlé's MCP door trusts (plan 149).
#
# Dex federates Google and GitHub behind ONE OpenID Connect issuer. Authelia cannot do this: it supports
# the OIDC Provider role only, never the Relying Party role that "log in with Google/GitHub" needs
# (authelia/authelia issue #2728). Authelia stays where it already works — the web halls' forward-auth.
#
# Copy this file to config.yaml BESIDE docker-compose.yml on the host that runs Dex (never into a repo),
# replace EVERY `https://id.example.org/dex` with the operator's own public issuer URL, then fill dex.env
# from dex.env.example. Dex expands `$NAME` only inside connector configs (measured on v2.41.1: an
# environment variable in `issuer:` stays literal text), so the issuer and the callbacks are written here
# literally, and the env file carries only the ids and secrets.
#
# Where each id and secret comes from — the operator creates these in the providers' own consoles:
#
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
#       github.com → Settings → Developer settings → OAuth Apps → New OAuth App
#       Homepage URL:               the issuer's origin (https://id.example.org)
#       Authorization callback URL: https://id.example.org/dex/callback   (exactly — the issuer + /callback)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#       console.cloud.google.com → APIs & Services → Credentials → Create credentials → OAuth client ID
#       Application type: Web application
#       Authorized redirect URI:    https://id.example.org/dex/callback
#   GIMLE_MCP_CLIENT_SECRET
#       invented here, once: `openssl rand -hex 32`. It is the secret a connector (e.g. a custom connector's
#       "OAuth Client Secret" field) presents for the confidential client `gimle-mcp` below.

issuer: https://id.example.org/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db          # the compose file mounts ./state here — Dex's own state, nobody else's

web:
  http: 0.0.0.0:5556               # published on loopback only by the compose file; the tunnel fronts it

oauth2:
  responseTypes: [code]
  grantTypes: [authorization_code, refresh_token]
  skipApprovalScreen: true
  alwaysShowLoginScreen: false

expiry:
  idTokens: 1h                     # access tokens share this lifetime
  refreshTokens:
    validIfNotUsedFor: 168h
    absoluteLifetime: 720h

connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: $GITHUB_CLIENT_ID
      clientSecret: $GITHUB_CLIENT_SECRET
      redirectURI: https://id.example.org/dex/callback
      useLoginAsID: true           # the GitHub login becomes the stable id
      teamNameField: slug
      # Groups from GitHub teams (optional). With this block, a member of team `gimle-all` in `your-org`
      # carries the group `your-org:gimle-all`, which the door reads as `gimle-all`. Without it, grant
      # people in the door's own groups file (--oauth-groups) instead.
      # orgs:
      #   - name: your-org
      #     teams: [gimle-all, gimle-write]
  - type: google
    id: google
    name: Google
    config:
      clientID: $GOOGLE_CLIENT_ID
      clientSecret: $GOOGLE_CLIENT_SECRET
      redirectURI: https://id.example.org/dex/callback
      # Google carries no groups without a Workspace admin service account; grant Google users in the
      # door's groups file by their email.
  # A stand-in connector for a first dry run before the provider apps exist: anyone who presses the
  # button is Dex's one fixed, fictional test user. REMOVE before real people use the issuer.
  # - type: mockCallback
  #   id: mock
  #   name: Stand-in (testing only)

staticClients:
  # The door's confidential client — for connectors that hold a secret (a custom connector's advanced
  # settings take this id and secret). Its tokens carry aud=gimle-mcp, which the door accepts.
  - id: gimle-mcp
    name: Gimlé
    secretEnv: GIMLE_MCP_CLIENT_SECRET
    redirectURIs:
      - https://claude.ai/api/mcp/auth_callback
      - https://claude.com/api/mcp/auth_callback
  # The door's public client — for command-line harnesses and mcp-remote, which log in through a loopback
  # redirect with PKCE and hold no secret. Dex lets a public client redirect to http://localhost on any
  # port — and, measured on v2.41.1, NOT to http://127.0.0.1, so the client must call back on localhost.
  - id: gimle-mcp-cli
    name: Gimlé (command line)
    public: true

enablePasswordDB: false
