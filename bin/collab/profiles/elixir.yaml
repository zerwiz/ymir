# project.yaml — the one file every collaboration-kit tool reads (kit {{kit}}).
# Change a value here and every tool follows. Anything left out takes the kit's default.

project: {{project}}
register: {{register}}              # plain | house — how the kit's words and names read; the facts are the same
names:
  worktrees: {{worktrees}}          # where worktrees are made, under the main tree
  branch_prefix: {{branch_prefix}}       # a worktree's branch is <prefix>/<id>

languages:
  project: {{lang_project}}                    # code, commits, pull requests, documents
  client: [{{lang_client}}]                 # what a client reads or hears
  client_paths: [{{client_paths}}]
  files: report                  # report | refuse — a client tongue outside client_paths at a commit

stack:
  kind: elixir                   # mix
  link: [deps]                   # dependency sources are the same in every worktree
  never_share: [_build]          # compiled output is per worktree

hooks:
  chain: []

checks:
  commit: ["mix format --check-formatted", "mix compile --warnings-as-errors"]
  push: ["mix test"]

worktrees:
  max: 8                         # per repository on one machine
  stale_hours: 24                # idle this long, no process inside: the worker is gone
  expiry_days: 7
  max_leftovers: 2               # doctor and new refuse past this many leftovers
  close_merged_on_new: true

disk:
  min_free_pct: 15               # new, builds and doctor refuse below both floors
  min_free_gb: 40

containers:
  engine: podman
  product_hosts: []              # host names that run the product; a worker removes nothing there
  keep_tags: 2                   # the current and the previous release
  labels: [project, purpose, release]

leftovers:                       # RULES/24 — bash scripts/prune.sh reports; --apply acts
  worktrees: {apply: true}
  branches: {apply: true}
  remote_refs: {apply: true}
  caches: {apply: true, idle_hours: 24}
  scratch: {apply: true, dir: "", older_than_hours: 24}
  test_databases: {apply: false, pattern: "", list: "", drop: ""}
  images: {apply: true}
  volumes: {apply: true}
  stopped_containers: {apply: true, older_than_hours: 24}
