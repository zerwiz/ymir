# The doors that MUST have an MCP tool (plan 358, 2026-11-22). Every harness reaches Ymir through the MCP, so a door
# built without its tool is a door half the house cannot open. `bin/gates/guards/mcp-parity-guard.sh` fails when a row
# here names a tool `bin/mcp/ymir-mcp.py` does not register, or a door that is not in the tree.
# Add a row in the SAME change that builds the door. A door waiting for its build lists `when: <what must exist>`.
doors:
  - {door: bin/agents/veil.sh, tool: ymir_veil, built: 2026-11-22, what: the Veil - reports receipts and steering}
  - {door: bin/boards/plan-sync.sh, tool: ymir_board_sync, built: 2026-11-22, what: plans onto the project's board}
  - {door: bin/forge/gjallarhorn-publish.sh, tool: ymir_publish, built: 2026-11-22, what: an app on a public name behind the login}
  - {door: bin/fleet/fleet-tell.sh, tool: gna_fleet_tell, built: 2026-11-21, what: the one road to talk to and steer any agent}
  - {door: bin/records/plan.sh, tool: ymir_plan, built: 2026-11-22, what: a plan numbered after the ledger and the board}
  - {door: bin/records/note.sh, tool: ymir_note, built: 2026-11-22, what: an appended note and the card follows}
  - {door: bin/mcp/figures.py, tool: ymir_figure, built: 2026-11-22, what: a figure's kit for a task}
  - {door: bin/records/library.sh, tool: ymir_research, built: 2026-11-22, what: Huginn's road kept in the library}
  - {door: bin/records/context-gauge.sh, tool: ymir_context_gauge, when: the context gauge exists (plan 358 Part 1), what: how much each agent loads at start}
