# 20-one-port.conf — kokoro-serve binds the port every client dials (plan 326.0, Rule 07).
#
# Seat it:  install -Dm644 tools/systemd/kokoro-serve.service.d/20-one-port.conf \
#             ~/.config/systemd/user/kokoro-serve.service.d/20-one-port.conf
#           systemctl --user daemon-reload && systemctl --user restart kokoro-serve
#
# WHY: the engine bound its built-in default while a client was told another port, and "active" was read as
# "answering" — but the engine loads its model BEFORE it binds, so a unit can be active with nothing listening.
#
# WHAT: one value, KOKORO_SERVICE_URL, in $YMIR_HOME/config/voice.env (template: config/voice.env.example).
# The clients resolve it through bin/voice/kokoro-lib.sh; this unit reads the same file and binds its port.
# With no file, the engine's own default is used, which is the resolver's documented default too.
# ExecStartPost holds "activating" until the socket answers, so "active" means listening.
# PYTHONUNBUFFERED puts the engine's "listening on" line in the journal at once.
#
# It only replaces ExecStart; the execution provider (10-cpu-voice.conf) and the model flags are untouched.
[Service]
Environment=PYTHONUNBUFFERED=1
EnvironmentFile=-%h/Documents/ymirhome/config/voice.env
ExecStart=
ExecStart=/bin/bash -c 'u="$${KOKORO_SERVICE_URL:-}"; p="$${u##*:}"; p="$${p%%%%/*}"; exec %h/.local/bin/kokoro serve --model full $${u:+--port "$$p"}'
ExecStartPost=/bin/bash -c 'for i in $$(seq 1 120); do ss -Htln --process 2>/dev/null | grep -q "pid=$${MAINPID}," && exit 0; sleep 0.5; done; echo "kokoro-serve: the engine (pid $${MAINPID}) bound no port in 60 s" >&2; exit 1'
TimeoutStartSec=90
