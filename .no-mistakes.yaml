# Per-repo no-mistakes overrides for Ymir (the Brokk distro).

# Ymir's AGENTS.md installs the Brokk primary identity. Disable project-level
# agent settings/instructions for gate agents so a no-mistakes
# review/fix/document/test/lint/pr/rebase/ci agent never adopts the primary
# identity or drives the fleet. Trusted-only: honored only from the
# default-branch copy of this file.

disable_project_settings: true

# Pin lint to the repository's canonical lint gate (`bin/brokk-lint.sh`), also
# invoked directly by CI, so local and CI lint cannot diverge.
commands:
  lint: 'bin/brokk-lint.sh'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch
# linked from the PR; it is never committed to the feature or default branch.
test:
  evidence:
    store_in_repo: true
