[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ymir-runtime"
version = "1.0.0"
description = "THE ENGINE — one deep module, four verbs: seat · status · send · stop (plan 58, Phase 1)"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Documentation = "https://github.com/zerwiz/ymir"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["ymir_runtime", "ymir_runtime.tests"]

[tool.ymir]
engine = "ymir_runtime"
interface = ["seat", "status", "send", "stop"]
strangler = "bin/eindri-start.sh · bin/einherjar-spawn.sh keep the old road until parity is proven"
