    craft: "review — judge the work (the automatic PR-review spine)"
    dispatch: true
    keywords: [review, judge, audit, critique, verify, assess, check, inspect, quality, gate, pr, "pull request", ship]
    tools: [vector_db, hermes_runner, herder, yggdrasil]

  builder:
    figure: galdr
    craft: "runtime — the Ymir distro itself"
    dispatch: true
    keywords: [galdr, runtime, distro, install, skill, toon, cli, agent-facing, extension]
    tools: [yggdrasil, herder, vector_db, tasks_cli]
    skills: [galdr-ymirsystem]

  # ─── the named roles — summoned by figure or role, never chosen by keyword ───
  primary:
    figure: brokk
    craft: "the counsellor — plans, steers, reviews, dispatches"
    dispatch: false
    keywords: []
    tools: [yggdrasil, herder, vector_db, tasks_cli, well_recall]

  keeper:
