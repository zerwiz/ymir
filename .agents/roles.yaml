# .agents/roles.yaml — the decision table: ROLE → FIGURE → TOOLS.
#
# WHO a figure is lives in `.agents/agents/<figure>.md` (prose + frontmatter).
# THIS file is the WIRING: which role summons which figure, what the role does,
# the words that summon it, and the tools the figure holds at hand. It is DATA,
# read by the doors — `bin/agents/eindri-role.sh` (the chooser) and
# `bin/fleet/agents-config.sh roster` (the resolved roster) — so no script re-declares
# a role in code.
#
# WHAT MODEL: never here, and never in a figure card. The model is resolved from
# the hoard (`$YMIR_HOME/config/agents.yaml`, with the per-host overlay) BY
# FIGURE NAME at dispatch:
#
#   bin/fleet/agents-config.sh get <figure> model
#
# The public tree carries no model for hardware it has never seen (Rule 04,
# plan 56; plan 58 Phase 4).
#
# `tools` mirrors the figure card's `ymir_tools`; the card is the per-figure
# declaration, this file is the role-keyed view the chooser and the roster read.
# `dispatch: true` marks the roles the chooser weighs when it picks a smith;
# the rest are summoned by name.

version: 1
model_from: hoard

roles:
  # ─── the dispatch roles — the chooser's candidates, in chooser order ───
  developer:
    figure: sindri
    craft: "code — build, refactor, fix, test"
    dispatch: true
    keywords: [code, build, refactor, fix, bug, implement, feature, test, compile, script, forge, api, backend, frontend, function, class, module]
    tools: [yggdrasil, herder, hermes_runner, vector_db, supabase]

  marketer:
    figure: bragi
    craft: "content — marketing, SEO, social"
    dispatch: true
    keywords: [content, write, copy, marketing, seo, social, post, article, blog, campaign, brand, announcement, newsletter]
    tools: [vector_db, supabase, hermes_runner, herder, yggdrasil]

  researcher:
    figure: huginn
    craft: "research — search, analyse, discover"
    dispatch: true
    keywords: [research, search, analyse, analyze, investigate, find, discover, compare, benchmark, source, docs, "look", up]
    tools: [vector_db, hermes_runner, herder, yggdrasil, supabase, mimirsbrunn, huginn_research_worker]

  scout:
