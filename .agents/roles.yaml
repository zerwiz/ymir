    craft: "design — UI/UX, prototypes, decks, dashboards"
    dispatch: true
    keywords: [design, ui, ux, prototype, landing, dashboard, deck, slide, visual, layout, figma, design-system]
    tools: [opendesign, chrome_devtools]

  planner:
