# autojoin.conf — PUBLIC defaults. No meeting content, no names, no secrets.
AUTOJOIN_ENABLED=1
AUTOJOIN_WORKSPACES="work"
AUTOJOIN_PERSONAL=0
AUTOJOIN_LEAD_SECONDS=120
AUTOJOIN_MAX_PER_RUN=3
AUTOJOIN_BLOCK_TITLES="1:1|private|personal|doctor|dentist|therapy|interview"
AUTOJOIN_ALLOWED_PLATFORMS="google_meet,zoom,teams,jitsi,ping"
