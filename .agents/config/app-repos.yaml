# App repositories — PUBLIC map (the five surfaces)
#
# The fork path: a fresh clone has no private hoard (no
# `$YMIR_HOME/hodd/identity/projects.yaml`), so bin/engine/ymir-install.sh's `apps`
# step falls back to THIS file to clone the five app repos. The hoard registry
# stays authoritative when present; this file is the fork's road.
#
# Block shape must match the installer's awk (repo: apps/<path> + git: dict).
#
# 2026-11-19 — the split (plan 01): this file is the app REGISTRY (RULES/23, appended).
#   home:      the app's folder name in the apps home ($YMIR_APPS_HOME/<home>/)
#   kind:      electron | service — the Allfather: "only electron apps. no web."
#   contract:  0 = still in Ymir's tree (the legacy road) · 1 = its own repo carries the
#              app contract (app.yaml, install.sh) and `bin/apps/apps.sh` installs it
#   status:    archived = kept as a record, never installed (the phone app: "no phone app")
#   moved:     <owner>/<repo>@<sha> — the app left this tree with its history; bin/no-delete-guard.sh reads
#              it, so removing apps/<dir> is a move (RULES/11), never a deletion
#   moved_also: paths outside apps/ that left with the app (the guard reads them too)
#   install_default: true = `apps.sh update --all` (Gróa) installs it on a seat that lacks it
# `repo: apps/<path>` stays the folder the app has in Ymir's tree until its slice lands.

- id: hlidskjalf
  name: Hlidskjalf
  repo: apps/hlidskjalf
  posture: direct-PR
  git: { host: github.com, owner: zerwiz, repo: hlidskjalf, remote: origin, default_branch: main, auth: gh }
  home: hlidskjalf
  kind: electron
  contract: 0
  stays_in_ymir: true   # the Allfather 2026-11-18: "leave hlidskjalf in ymir"

- id: hlidskjalf-mobile
  name: Hlidskjalf Mobile
  repo: apps/hlidskjalf-mobile
  posture: direct-PR
  git: { host: github.com, owner: zerwiz, repo: hlidskjalf-mobile, remote: origin, default_branch: main, auth: gh }
  home: hlidskjalf-mobile
  kind: electron
  contract: 0
  status: archived       # "no phone app" (2026-11-18)

- id: odrerir
  name: Óðrerir
  repo: apps/odrerir
  posture: direct-PR
  git: { host: github.com, owner: zerwiz, repo: odrerir, remote: origin, default_branch: main, auth: gh }
  home: odrerir
  kind: electron
  contract: 0

- id: sessrumnir
  name: Sessrúmnir
  repo: apps/sessrumnir
  posture: direct-PR
  git: { host: github.com, owner: zerwiz, repo: sessrumnir, remote: origin, default_branch: main, auth: gh }
  home: sessrumnir
  kind: electron
  contract: 1
  moved: zerwiz/sessrumnir@133a42991a0c   # left Ymir with its history, 2026-11-19; the fork's upstream is FaqFirebase/pi-desktop
  install_default: dev   # the seats with a desk: it is the desktop seat over the coding agents

- id: smidja
  name: Smíðja factory
  repo: apps/smidja-factory
