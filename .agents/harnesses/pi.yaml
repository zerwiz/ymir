# Pi — the first harness, and the shape the others are measured against.
name: pi
binary: pi
detect:
  process: ["pi", "pi-signed"]
  env: []
launch: "pi"
inject: "pi --print <prompt>"
transcript:
  shape: jsonl-tree          # id/parentId; a branch is a second child in the same file
  root: ~/.pi/agent/sessions
  path: "sessions/--<cwd-slug>--/<timestamp>_<id>.jsonl"
extensions:
  global_dir: ~/.pi/agent/extensions
  project_dir: .pi/extensions
  format: "ts|js file, or a directory with index.ts|index.js"
  dedupe: "settings extensions[] is resolved by realpath — one path, no double registration"
  # Two FULL checkouts of one repository are two homes to pi's loader, which de-duplicates
  # on the resolved path alone: a bare `pi` in a checkout the settings do not name used to
  # load 44 colliding extensions and refuse them all (2026-11-11). bin/seat/pi-door.sh is
  # seated as ~/.pi/agent/bin/pi and hands such a launch one home, untouched everywhere else.
  door: ~/.pi/agent/bin/pi
# THE PI ROOT SET (plan 248 P3, RULES/51 — 2026-11-11). What every pi session carries from ANY directory —
# ~, an unrelated project — after a fresh install and after every update. The root settings `extensions[]`
# names the PINNED runtime's tree ($YMIR_RUNTIME_DIR/.pi/extensions, resolved by bin/seat/runtime-root.sh),
# never a working tree, so the whole tree loads; `root_extensions` are the ones that must stand in it.
# `packages` is the ONE place pi's npm packages are named: bin/pi/pi-ensure.sh reads this list and installs
# each through `pi install`, and bin/seat/harness-extensions-install.sh calls it on install AND update.
root_extensions:
  - ro
  - todo
  - open-editor
packages:
  - npm:pi-mcp-adapter
  - npm:pi-web-access
  - npm:@llblab/pi-telegram
  - npm:@juicesharp/rpiv-ask-user-question
instructions:
  global: ~/.pi/agent/AGENTS.md
  project: AGENTS.md
config: ~/.pi/agent/{settings,models,auth}.json
capabilities:
  streaming: full
  hooks: full                # extensions subscribe to lifecycle events
  resume: full
  mcp: full
