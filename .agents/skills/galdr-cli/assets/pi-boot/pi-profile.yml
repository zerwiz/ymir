# PI Profile — Default Firstmate Harness Profile for Ymir

profile:
  name: "pi"
  description: "Principal Investigator — system primary agent for Ymir"
  version: "1.0.0"

agent:
  model: "lmstudio/qwen3.6-35b-a3b"
  temperature: 0.7
  max_tokens: 8192
  system_prompt: "BROKK — SYSTEM OPERATING MANUAL (see .opencode/agents/brokk.md)"

context:
  max_tokens: 48000
  budget_warning_percent: 50
  compaction:
    auto: true
    tail_turns: 15

tools:
  enabled:
    - read
    - write
    - edit
    - bash
    - glob
    - grep
    - task
    - skill
    - question
    - webfetch
    - websearch
    - lsp
    - todowrite
  bash_patterns:
    - "git *": "allow"
    - "npx *": "allow"
    - "python3 *": "allow"
    - "docker *": "allow"
    - "gh *": "allow"
    - "*": "allow"

workspace:
  root: "/home/zerwiz/Ymir"
  realm: "auto"
  paths:
    skills: ".agents/skills"
    tools: ".agents/tools"
    subagents: ".agents/subagents"
    assets: ".agents/assets"
    plans: "docs/plans"
    memory: "workspace/memory"

herdr:
  session_name: "ymir-pi"
  layout: "vertical"
  panes:
    - name: "brokk"
      command: "opencode"
      focus: true
    - name: "eindri-dev"
      command: "opencode"
    - name: "eindri-marketer"
      command: "opencode"
    - name: "eindri-researcher"
      command: "opencode"
    - name: "valhalla"
      command: "tail -f /dev/null"

fm_spawn:
  default_profile: "pi"
  worker_profiles:
    - "eindri-dev"
    - "eindri-marketer"
    - "eindri-researcher"
  dispatch_timeout_ms: 30000
  observe_before_dispatch: true
  carve_runes_on_complete: true

mimirsbrunn:
  endpoint: "http://localhost:4602"
  agent_keys:
    - "agent://ymir/brokk"
    - "agent://ymir/eindri-dev"
    - "agent://ymir/eindri-marketer"
    - "agent://ymir/eindri-researcher"
  recall_mode: "hybrid"

utgard:
  default_caps:
    cpu: "2.0"
    memory: "4g"
    timeout: "300s"
  network: "none"
  rootless: true