# Valhalla Supervision Tree — PI Supervision Branch

supervision:
  name: "ymir-pi-supervision"
  description: "Valhalla supervision branch for PI primary boot under Brokk"
  backend: "supervisord"  # or pm2/docker/systemd/npm
  config_file: "$YMIR_ROOT/.config/supervisord/ymir-pi.conf"

processes:
  - name: "brokk-primary"
    command: "opencode --agent brokk"
    directory: "$YMIR_ROOT"
    user: "<user>"
    autostart: true
    autorestart: "unexpected"
    startsecs: 10
    startretries: 3
    stderr_logfile: "$YMIR_ROOT/logs/brokk.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/brokk.out.log"
    environment:
      OPENCODE_AGENT: "brokk"
      YMIR_REALM: "auto"
    health_check:
      endpoint: "http://localhost:8080/health/brokk"
      interval: 30
      timeout: 5

  - name: "eindri-dev-worker"
    command: "opencode --agent build"
    directory: "$YMIR_ROOT/.yggdrasil/eindri-dev"
    user: "<user>"
    autostart: false
    autorestart: "unexpected"
    startsecs: 15
    startretries: 2
    stderr_logfile: "$YMIR_ROOT/logs/eindri-dev.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/eindri-dev.out.log"
    environment:
      OPENCODE_AGENT: "build"
      YMIR_REALM: "auto"
      EINDRI_ROLE: "developer"
      YGGDRASIL_WORKTREE: "$YMIR_ROOT/.yggdrasil/eindri-dev"
    health_check:
      endpoint: "http://localhost:8081/health/eindri-dev"
      interval: 30
      timeout: 5

  - name: "eindri-marketer-worker"
    command: "opencode --agent build"
    directory: "$YMIR_ROOT/.yggdrasil/eindri-marketer"
    user: "<user>"
    autostart: false
    autorestart: "unexpected"
    startsecs: 15
    startretries: 2
    stderr_logfile: "$YMIR_ROOT/logs/eindri-marketer.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/eindri-marketer.out.log"
    environment:
      OPENCODE_AGENT: "build"
      YMIR_REALM: "auto"
      EINDRI_ROLE: "marketer"
      YGGDRASIL_WORKTREE: "$YMIR_ROOT/.yggdrasil/eindri-marketer"
    health_check:
      endpoint: "http://localhost:8082/health/eindri-marketer"
      interval: 30
      timeout: 5

  - name: "eindri-researcher-worker"
    command: "opencode --agent build"
    directory: "$YMIR_ROOT/.yggdrasil/eindri-researcher"
    user: "<user>"
    autostart: false
    autorestart: "unexpected"
    startsecs: 15
    startretries: 2
    stderr_logfile: "$YMIR_ROOT/logs/eindri-researcher.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/eindri-researcher.out.log"
    environment:
      OPENCODE_AGENT: "build"
      YMIR_REALM: "auto"
      EINDRI_ROLE: "researcher"
      YGGDRASIL_WORKTREE: "$YMIR_ROOT/.yggdrasil/eindri-researcher"
    health_check:
      endpoint: "http://localhost:8083/health/eindri-researcher"
      interval: 30
      timeout: 5

  - name: "herdr-multiplexer"
    command: "herdr start --config $YMIR_ROOT/.agents/skills/galdr-ymirsystem/assets/pi-boot/herdr-profile.toml"
    directory: "$YMIR_ROOT"
    user: "<user>"
    autostart: true
    autorestart: "always"
    startsecs: 5
    startretries: 5
    stderr_logfile: "$YMIR_ROOT/logs/herdr.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/herdr.out.log"
    environment:
      HERDR_SESSION: "ymir-pi"
      THJAZI_PROTOCOL: "14"
    health_check:
      endpoint: "http://localhost:8084/health/herdr"
      interval: 30
      timeout: 5

  - name: "mimirsbrunn-bridge"
    command: "python3 $YMIR_ROOT/bin/mimir-bridge.py"
    directory: "$YMIR_ROOT"
    user: "<user>"
    autostart: true
    autorestart: "always"
    startsecs: 10
    startretries: 3
    stderr_logfile: "$YMIR_ROOT/logs/mimirsbrunn.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/mimirsbrunn.out.log"
    environment:
      ENGRAM_PORT: "4602"
      ENGRAM_DATA_DIR: "$YMIR_ROOT/.agents/memory"
    health_check:
      endpoint: "http://localhost:4602/health"
      interval: 30
      timeout: 5

  - name: "ratatoskr-bus"
    command: "node $YMIR_ROOT/.agents/bus/ratatoskr_server.js"
    directory: "$YMIR_ROOT"
    user: "<user>"
    autostart: true
    autorestart: "always"
    startsecs: 5
    startretries: 3
    stderr_logfile: "$YMIR_ROOT/logs/ratatoskr.err.log"
    stdout_logfile: "$YMIR_ROOT/logs/ratatoskr.out.log"
    environment:
      RATATOSKR_PORT: "4603"
      REDIS_URL: "redis://localhost:6379"
    health_check:
      endpoint: "http://localhost:4603/health"
      interval: 30
      timeout: 5

groups:
  - name: "pi-core"
    processes: ["brokk-primary", "herdr-multiplexer", "mimirsbrunn-bridge", "ratatoskr-bus"]
    priority: 10

  - name: "eindri-workers"
    processes: ["eindri-dev-worker", "eindri-marketer-worker", "eindri-researcher-worker"]
    priority: 5

  - name: "pi-all"
    processes: ["pi-core", "eindri-workers"]
    priority: 1

lifecycle:
  on_start:
    - "mkdir -p $YMIR_ROOT/logs"
    - "mkdir -p $YMIR_ROOT/.yggdrasil"
    - "mkdir -p $YMIR_ROOT/workspace/memory"
  on_stop:
    - "echo 'Valhalla: PI supervision branch stopped' >> $YMIR_ROOT/workspace/memory/runes_audit.md"
  on_restart:
    - "echo 'Valhalla: Process $PROCESS_NAME restarted at $(date)' >> $YMIR_ROOT/workspace/memory/runes_audit.md"