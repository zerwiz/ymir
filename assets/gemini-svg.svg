<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Slate Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Forged Metal Body -->
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Inner Chiseled Edge Highlight -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadow for Canvas Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Slate Background -->
  <rect width="512" height="512" rx="48" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Master Emblem Group -->
  <g filter="url(#shadow)">
    
    <!-- Outer Dark Metal Forging Layer -->
    <g fill="none" stroke="url(#dark-metal)" stroke-width="48" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Algiz Y-Stem & Branches -->
      <path d="M 144 144 L 256 256 L 368 144 M 256 256 V 352" />
      <!-- Top Anvil Bar -->
      <path d="M 128 352 H 384" />
      <!-- Bottom Anvil Bar Base -->
      <path d="M 160 432 H 352" />
    </g>

    <!-- Inner Cyan Chisel Highlight Line -->
    <g fill="none" stroke="url(#cyan-glow)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
      <!-- Algiz Y-Stem & Branches -->
      <path d="M 144 144 L 256 256 L 368 144 M 256 256 V 352" />
      <!-- Top Anvil Bar -->
      <path d="M 128 352 H 384" />
      <!-- Bottom Anvil Bar Base -->
      <path d="M 160 432 H 352" />
    </g>

  </g>
</svg>
