<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Obsidian Canvas -->
  <rect width="512" height="512" rx="32" fill="#090b10"/>

  <!-- Master Consolidated Stave Path -->
  <g fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
    
    <!-- 1. PRIMARY AXIS CROSS (N-S and E-W Main Stems) -->
    <path d="M 256 80 V 432 M 80 256 H 432" />

    <!-- 2. DIAGONAL AXES (NE, SE, SW, NW Stems) -->
    <path d="M 132 132 L 380 380 M 380 132 L 132 380" />

    <!-- 3. NORTH ARM (Top): Exact Manuscript Grid-Box Terminal -->
    <!-- Outer Box -->
    <path d="M 228 80 H 284 V 124 H 228 Z" stroke-width="5" fill="#090b10" />
    <!-- 3 Internal Crossbars -->
    <path d="M 228 91 H 284 M 228 102 H 284 M 228 113 H 284" stroke-width="4" />

    <!-- 4. NORTH-EAST ARM: 3 Diagonal Prongs over Base Arc -->
    <path d="M 356 116 L 392 152 M 368 104 L 404 140 M 344 128 L 380 164" />
    <path d="M 340 158 Q 364 134 388 110" stroke-width="5" />

    <!-- 5. EAST ARM (Right): Double Stem Crosses & 3-Prong Fork -->
    <!-- Crossbars -->
    <path d="M 368 240 V 272 M 388 240 V 272" stroke-width="5" />
    <!-- Terminal Fork -->
    <path d="M 432 230 V 282 M 432 230 H 456 M 432 256 H 456 M 432 282 H 456" stroke-width="5" />

    <!-- 6. SOUTH-EAST ARM: 3 Parallel Diagonal Hash Lines -->
    <path d="M 332 364 L 364 332 M 346 378 L 378 346 M 360 392 L 392 360" stroke-width="5" />

    <!-- 7. SOUTH ARM (Bottom): Wide Bracket with 3 Vertical Pegs -->
    <path d="M 192 432 H 320 M 192 432 V 400 M 320 432 V 400" stroke-width="7" />
    <path d="M 224 432 V 410 M 256 432 V 410 M 288 432 V 410" stroke-width="5" />

    <!-- 8. SOUTH-WEST ARM: 3 Inverse Diagonal Hash Lines -->
    <path d="M 180 332 L 148 364 M 166 346 L 134 378 M 152 360 L 120 392" stroke-width="5" />

    <!-- 9. WEST ARM (Left): Left-Facing 3-Prong Comb -->
    <path d="M 80 224 V 288 M 80 224 H 56 M 80 256 H 56 M 80 288 H 56" stroke-width="5" />

    <!-- 10. NORTH-WEST ARM: Terminal Circle with Top Cross & Side Ticks -->
    <circle cx="132" cy="132" r="18" stroke-width="5" fill="#090b10" />
    <!-- Top Cross -->
    <path d="M 132 114 V 94 M 122 104 H 142" stroke-width="4" />
    <!-- Side Rays -->
    <path d="M 102 118 L 116 128 M 148 136 L 162 146" stroke-width="4" />

    <!-- 11. CENTER NEXUS -->
    <circle cx="256" cy="256" r="4" fill="#e2e8f0" />
  </g>
</svg>
